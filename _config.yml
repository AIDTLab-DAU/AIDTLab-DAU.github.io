# ---------------------------------------------------------------
# AI Digital Twin Lab @ Dong-A University — site configuration
# Built by GitHub Pages (classic build, github-pages gem).
# Lab content lives in _data/ (members, publications, projects…)
# and _news/ — see README.md for how to update it.
# ---------------------------------------------------------------
title: AI Digital Twin Lab
tagline: Dong-A University, Busan, Korea
description: >-
  Official website of the AI Digital Twin Lab at Dong-A University (AIDT Lab@DAU), Busan, Korea —
  research on digital twins, smart cities, 3D vision, semantic ontologies and agentic AI.
url: "https://aidtlab-dau.github.io"
baseurl: ""
lang: en
logo: /images/brand/emblem.png
author:
  name: AIDT Lab@DAU
social:
  name: AI Digital Twin Lab, Dong-A University
  links:
    - https://github.com/AIDTLab-DAU
google_analytics_id: G-3WYKVC20DN

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
permalink: pretty
timezone: Asia/Seoul

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  news:
    output: true
    permalink: /news/:year/:title/

include:
  - _pages

defaults:
  - scope: { path: "_pages" }
    values: { layout: page }
  - scope: { path: "", type: news }
    values: { layout: news }

feed:
  collections:
    - news

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .vscode/
  - .github/
  - _tools/
  - node_modules/
