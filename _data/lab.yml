mission: Building intelligent digital twins of cities — from 3D semantic models to agentic AI that predicts, explains and responds.
mission_ko: 3D 시맨틱 모델부터 예측·설명·대응하는 에이전틱 AI까지, 도시를 위한 지능형 디지털 트윈을 연구합니다.

about:
  - en: The AI Digital Twin Lab at Dong-A University researches artificial intelligence for digital twins — with a strong emphasis on deep learning, 3D computer vision, semantic city models and agentic AI. Our work spans theoretical advances and real deployments, bridging academic research and real-world urban challenges.
    ko: 동아대학교 AI-디지털 트윈 연구실은 딥러닝, 3D 컴퓨터 비전, 시맨틱 도시 모델, 에이전틱 AI를 중심으로 디지털 트윈을 위한 인공지능을 연구합니다. 이론적 성과와 실제 적용을 아우르며 학술 연구와 현실 도시 문제를 연결합니다.
  - en: We foster an interdisciplinary environment where students, researchers and industry partners collaborate. Backed by advanced computing infrastructure and national research programs, we push the boundaries of AI-driven modeling, simulation and intelligent systems.
    ko: 학생, 연구자, 산업 파트너가 함께하는 융합 연구 환경을 지향하며, 첨단 컴퓨팅 인프라와 국가 연구 과제를 바탕으로 AI 기반 모델링·시뮬레이션·지능형 시스템의 한계를 넓혀갑니다.

