  intro_ko: AI, 디지털 트윈, 스마트시티 기술에 관심 있는 열정적인 대학원생(박사, 석사, 석박사 통합)을 모집합니다. 협력적인 팀에서 최첨단 연구를 하고 싶다면 언제든 연락 주세요.
