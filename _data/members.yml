- id: sooyolok
  name: Soo-Yol Ok
  name_ko: 옥수열
  group: faculty
  title: Professor · Director, AI-Digital Twin-SW Demonstration Center
  title_ko: 교수 · AI·디지털트윈·SW 실증센터장
  field: Digital twins, GPU-based supercomputing, multiple-inference AI
  page: /member/professors/sooyolok
  links:
    email: sooyol@dau.ac.kr
  bio: >-
    Soo-Yol Ok received a B.Sc. in industrial engineering from Dong-A University in 1994, and his M.Sc. and Ph.D.
    from the Institute of Information Sciences and Electronics, University of Tsukuba, Japan, in 1998 and 2001. He was a
    senior researcher at Japan's National Institute of Information and Communications Technology (NICT) from 2001 to 2003,
    and from 2004 to 2019 an assistant, associate and full professor in the Department of Game Engineering at Tongmyong
    University, where he founded the Center for Fusion and Application of Super-computing (GPU-accelerated computing) and the
    Offshore Plant O&M Engineering Simulation Center. He served on the expert committee of the Busan Eco Delta Smart City
    National Model City project (2018–2021). He is now a full professor of Computer Engineering at Dong-A University,
    director of the AI-Digital Twin-SW Demonstration Center since 2022, and general manager of the MSIT
    "Digital Twin Testbed Establishment" project.

- id: sukhwanlee
  name: Suk-Hwan Lee
  group: faculty
  title: Professor · Dean, College of Computer & AI Engineering
  title_ko: 교수 · 컴퓨터·AI공학부 학장
  field: Digital twin platforms, AI-based computer vision, multimedia & AI security
  page: /member/professors/sukhwanlee
  links:
    email: skylee@dau.ac.kr
    orcid: https://orcid.org/0000-0003-4779-2888
    github: https://github.com/SukHwanLee
    scholar: https://scholar.google.co.kr/citations?hl=ko&user=8fZ6XOoAAAAJ
    ieee: https://ieeexplore.ieee.org/author/37293422800
    researchgate: https://www.researchgate.net/profile/Suk-Hwan-Lee
  bio: >-
    Suk-Hwan Lee received his B.S., M.S. and Ph.D. in Electrical Engineering from Kyungpook National University in 1999,
    2001 and 2004. He was an assistant, associate and full professor in the Department of Information Security at
    Tongmyong University (2005–2019) and Dean of its College of Software Engineering in 2019. He is now a full professor
    of Computer Engineering at Dong-A University and, since 2023, Dean of the College of Computer & AI Engineering. His
    research covers multimedia security, image/video processing, digital twin platforms, AI-based computer vision and AI
    security. He has been a board member of the IEEE R10 Busan Section since 2015, chief editor of the Korea Multimedia
    Society since 2021, general manager of the "Software Centered University" project and practice head of the MSIT
    "Digital Twin Testbed Establishment" project.

