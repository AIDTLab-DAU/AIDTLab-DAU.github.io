- id: energybuilder
  title: EnergyBuilder — Digital-Twin Energy Optimization (Horizon Europe)
  title_ko: 에너지빌더 — 디지털 트윈 기반 건물 에너지 최적화 (호라이즌 유럽)
  short: EnergyBuilder
  period: 2026 –
  status: ongoing
  program: Horizon Europe international joint research
  program_ko: EU 호라이즌 유럽 국제 공동연구
  funder: European Union
  image: /images/news/2026-horizon-europe-1.jpg
  news: /news/2026/horizon-europe-energybuilder/
  summary: As Korean lead institution, we develop a digital-twin platform that maximizes building energy efficiency across design and operation, turning buildings into energy "prosumers" with AI, digital twins and virtual power plants — piloted at the Busan Eco Delta Smart Village and European living labs.
  summary_ko: 국내 주관기관으로서 AI·디지털 트윈·가상발전소 기술을 활용해 건물의 설계·운영 단계 에너지 효율을 극대화하고 건물을 '프로슈머'로 전환하는 플랫폼을 개발하며, 부산 에코델타 스마트빌리지와 유럽 리빙랩에서 실증합니다.
  tags: [Energy, Digital Twin, International]

- id: dt-testbed
  title: Digital Twin Testbed for Smart City Infrastructure
  title_ko: 스마트시티 디지털 트윈 테스트베드 구축
  short: Digital Twin Testbed
  period: Apr 2022 – Dec 2025
  status: completed
  program: "Digital Twin Testbed Establishment (No. 2022-0-00622)"
  program_ko: 디지털 트윈 테스트베드 구축 (No. 2022-0-00622)
  funder: MSIT · IITP
  image: /images/research/digital-twin-project.jpg
  page: /research/digital-twin-smart-city
