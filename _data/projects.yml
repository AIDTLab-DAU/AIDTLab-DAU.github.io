- id: javis
  title: "JAVIS — Joint Autonomous Resilience Virtual Intelligent System"
  title_ko: "JAVIS — 복합재난 대응 자율 회복 가상 지능 시스템"
  short: JAVIS
  period: 2025 – 2032
  status: ongoing
  program: Digital Columbus Project (Disaster Safety)
  program_ko: 디지털 콜럼버스 프로젝트 (재난안전 분야)
