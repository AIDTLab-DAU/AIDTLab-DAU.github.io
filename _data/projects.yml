  summary_ko: 계층형 플러그인 서비스 플랫폼, 3DCityDB 기반 도시 데이터 관리, CityGML과 SensorThings API를 연결하는 개방형 표준 IoT 온톨로지를 개발하고 부산 에코델타 스마트시티 랩에서 실증했습니다.
  tags: [Smart City, CityGML, Ontology]
