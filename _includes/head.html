<script>
  /* Apply saved theme + language before first paint (no flash). */
  (function () {
    var d = document.documentElement;
    try {
      var t = localStorage.getItem('aidt-theme'); if (t) d.setAttribute('data-theme', t);
      var q = (location.search.match(/[?&]lang=(en|ko)/) || [])[1]; if (q) localStorage.setItem('aidt-lang', q);
      var l = q || localStorage.getItem('aidt-lang'); if (l === 'ko') { d.setAttribute('data-lang', 'ko'); }
    } catch (e) {}
    d.classList.add('js');
  })();
</script>
